version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    schedule:
      interval: monthly

  - package-ecosystem: 'github-actions'
    directory: '/'
    groups:
      all-dependencies:
        patterns:
          - '*'
    schedule:
      interval: monthly
